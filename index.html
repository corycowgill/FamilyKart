<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2a7a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Family Kart" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <title>Family Kart Racing</title>
    <meta name="description" content="A colorful, chaotic family kart racing game starring Dad, Mom, Bro 1, Bro 2, Lupin and Grandma." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lilita+One&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- Studio ident. Vendored from gameCentral/intro/hallucinated-intro.js so this
         game stays a self-contained deploy; re-copy that file to take an update.
         Plain script, not a module: it defines window.HallucinatedIntro. -->
    <script src="./intro/hallucinated-intro.js"></script>
  </head>
  <body>
    <!-- Start the studio ident before anything else paints. Classic script at the top of
         <body> (a module is deferred and would let the loader paint first). main.ts awaits
         window.__studioIntro before revealing the title, so the game loads underneath it. -->
    <script>
      window.__studioIntro = (function () {
        try {
          var q = new URLSearchParams(location.search);
          // test flags skip the ident so its overlay doesn't swallow synthetic input
          if (q.has('nointro') || q.has('dev') || q.has('laps') || q.has('autopilot') || !window.HallucinatedIntro) {
            return Promise.resolve();
          }
          // No sting: on a cold load there is no user gesture yet, so audio would be dropped.
          return window.HallucinatedIntro.play({ skippable: true, sound: false }).catch(function () {});
        } catch (e) {
          return Promise.resolve();
        }
      })();
    </script>
    <div id="app">
      <div id="viewport"></div>
      <div id="ui"></div>
      <div class="rotate-hint"><span>📱</span>Turn your device sideways to race!</div>
      <div id="boot-loader">
        <div class="boot-logo">FAMILY<br /><span>KART RACING</span></div>
        <div class="boot-stars" aria-hidden="true">
          <svg viewBox="-4 -4 108 108"><path d="M50,0L60.5,31.8L93.3,25L71,50L93.3,75L60.5,68.2L50,100L39.5,68.2L6.7,75L29,50L6.7,25L39.5,31.8Z" fill="#E4002B" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke" /></svg>
          <svg viewBox="-4 -4 108 108"><path d="M50,0L60.5,31.8L93.3,25L71,50L93.3,75L60.5,68.2L50,100L39.5,68.2L6.7,75L29,50L6.7,25L39.5,31.8Z" fill="#E4002B" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke" /></svg>
          <svg viewBox="-4 -4 108 108"><path d="M50,0L60.5,31.8L93.3,25L71,50L93.3,75L60.5,68.2L50,100L39.5,68.2L6.7,75L29,50L6.7,25L39.5,31.8Z" fill="#E4002B" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke" /></svg>
          <svg viewBox="-4 -4 108 108"><path d="M50,0L60.5,31.8L93.3,25L71,50L93.3,75L60.5,68.2L50,100L39.5,68.2L6.7,75L29,50L6.7,25L39.5,31.8Z" fill="#E4002B" stroke="#fff" stroke-width="7" stroke-linejoin="round" paint-order="stroke" /></svg>
        </div>
        <div class="boot-bar"><div></div></div>
        <div class="boot-tag">Made in the Windy City</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
