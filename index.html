<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cowgill Kart Racing</title>
    <meta name="description" content="A colorful, chaotic family kart racing game starring Dad, Mom, Brennan, Parker, Lupin and Grandma." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lilita+One&display=swap" rel="stylesheet" />
    <!-- Studio ident. Vendored from gameCentral/intro/hallucinated-intro.js so this
         game stays a self-contained deploy; re-copy that file to take an update.
         Plain script, not a module: it defines window.HallucinatedIntro. -->
    <script src="./intro/hallucinated-intro.js"></script>
  </head>
  <body>
    <!-- Start the studio ident before anything else paints. Classic script at the top of
         <body> (a module is deferred and would let the loader paint first). main.ts awaits
         window.__studioIntro before revealing the title, so the game loads underneath it. -->
    <script>
      window.__studioIntro = (function () {
        try {
          var q = new URLSearchParams(location.search);
          // test flags skip the ident so its overlay doesn't swallow synthetic input
          if (q.has('nointro') || q.has('dev') || q.has('laps') || q.has('autopilot') || !window.HallucinatedIntro) {
            return Promise.resolve();
          }
          // No sting: on a cold load there is no user gesture yet, so audio would be dropped.
          return window.HallucinatedIntro.play({ skippable: true, sound: false }).catch(function () {});
        } catch (e) {
          return Promise.resolve();
        }
      })();
    </script>
    <div id="app">
      <div id="viewport"></div>
      <div id="ui"></div>
      <div id="boot-loader">
        <div class="boot-logo">COWGILL<br /><span>KART RACING</span></div>
        <div class="boot-bar"><div></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
