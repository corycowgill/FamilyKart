<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Audio Preview - Cowgill Kart Racing</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #1b1d2a; color: #eee; margin: 0; padding: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      h2 { font-size: 15px; margin: 18px 0 6px; color: #ffd166; }
      button { margin: 3px; padding: 6px 10px; border: 0; border-radius: 6px; background: #3a3f5c; color: #fff; cursor: pointer; font-size: 13px; }
      button:hover { background: #50577f; }
      button.on { background: #06d6a0; color: #111; }
      label { display: inline-block; margin: 4px 12px 4px 0; font-size: 13px; }
      input[type=range] { vertical-align: middle; width: 160px; }
      #status { font-size: 12px; color: #9aa; }
      pre { background: #10121b; padding: 8px; font-size: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Cowgill Kart Racing - Audio Preview</h1>
    <div><button id="init">Init audio</button> <span id="status">not initialised</span></div>
    <h2>Volumes</h2>
    <div id="vols"></div>
    <h2>SFX</h2>
    <div>
      <label>pitch <input id="sfxPitch" type="range" min="0.5" max="2" step="0.05" value="1" /></label>
      <label>pan <input id="sfxPan" type="range" min="-1" max="1" step="0.1" value="0" /></label>
    </div>
    <div id="sfx"></div>
    <h2>Music</h2>
    <div id="music"></div>
    <div><label>intensity <input id="intensity" type="range" min="0" max="1" step="0.05" value="0" /></label></div>
    <h2>Engine voice</h2>
    <div id="engine"></div>
    <h2>Drift</h2>
    <div id="drift"></div>
    <h2>Offline render check</h2>
    <button id="offline">Render all offline &amp; measure</button>
    <pre id="report"></pre>
    <script type="module" src="/src/tools/audioPreview.ts"></script>
  </body>
</html>
